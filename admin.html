<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>集合页管理 · 卫华集团专场</title>
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="stylesheet" href="css/style.css?v=20261030-2">
</head>
<body>
  <main class="page admin-page">
    <h1 class="d">毛毡集合页管理</h1>
    <p class="felt-privacy">输入管理口令后，可以删除不合适的形象。删除后无法恢复。</p>
    <form class="admin-bar" id="adminForm">
      <input type="password" id="adminToken" placeholder="管理口令" autocomplete="current-password" aria-label="管理口令">
      <button class="btn btn-primary btn-sm" type="submit">进入</button>
    </form>
    <p class="felt-error" id="adminMsg" hidden></p>
    <p class="felt-done-sub" id="adminTotal" hidden></p>
    <div class="wall-grid" id="adminGrid"></div>
    <button class="btn btn-soft btn-block wall-more" type="button" id="adminMore" hidden>加载更多</button>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="js/main.js?v=20261030-2" defer></script>
  <script src="js/admin.js?v=20261030-2" defer></script>
</body>
</html>
